<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Support Portal</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#f4f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#111827;
    }

    .container{
      width:100%;
      max-width:480px;
    }

    .card{
      background:#fff;
      border-radius:20px;
      padding:45px 35px;
      text-align:center;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 4px 12px rgba(0,0,0,0.04);
      animation:fadeIn .4s ease;
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 25px;
      border-radius:18px;
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:bold;
    }

    h1{
      font-size:28px;
      margin-bottom:14px;
      color:#111827;
    }

    p{
      color:#6b7280;
      font-size:15px;
      line-height:1.7;
      margin-bottom:28px;
    }

    .input-group{
      margin-bottom:18px;
      text-align:left;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:600;
      color:#374151;
    }

    input{
      width:100%;
      padding:14px 16px;
      border:1px solid #d1d5db;
      border-radius:12px;
      outline:none;
      font-size:15px;
      transition:.2s;
    }

    input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,0.12);
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:#fff;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:.2s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .footer{
      margin-top:24px;
      color:#9ca3af;
      font-size:12px;
    }

    .error{
      margin-top:14px;
      color:#dc2626;
      font-size:14px;
      display:none;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:480px){
      .card{
        padding:35px 24px;
      }

      h1{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="logo">
        S
      </div>

      <h1>Secure Support Portal</h1>

      <p>
        Register service requests for approved devices and
        enterprise assets through our secure support system.
      </p>

      <div class="input-group">
        <label for="clientCode">Client Reference Code</label>

        <input
          type="text"
          id="clientCode"
          placeholder="Enter your reference code"
          autocomplete="off"
        />
      </div>

      <button onclick="continuePortal()">
        Continue to Portal
      </button>

      <div class="error" id="error">
        Please enter a valid reference code
      </div>

      <div class="footer">
        Secure Enterprise Service Request System
      </div>

    </div>
  </div>

  <script>

    function continuePortal(){

      const input =
        document.getElementById("clientCode");

      const error =
        document.getElementById("error");

      const client =
        input.value.trim();

      const valid =
        /^[a-zA-Z0-9_-]{3,50}$/.test(client);

      if(!valid){
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      window.location.href =
        `request.html?client=${encodeURIComponent(client)}`;
    }

  </script>

</body>
</html>
