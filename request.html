<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecting...</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    .loader {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Service Request Portal</h2>
    <div class="loader"></div>
    <p>Redirecting securely...</p>
  </div>

  <script>
    // Your Apps Script Web App URL
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby476ecukEizfce1mDME-1Y8h1y0oPqWAzbesy_fB5-0QmwXXJ_cHlEBsXvdGGXHdIEgw/exec";

    // Client mapping
    const CLIENT_MAPPING = {
      abc: "A7K2L1",
      xyz: "B8X9M2",
      demo: "C4P7R5",
      client4: "D9T2K4",
      client5: "E1W8L3"
    };

    const params = new URLSearchParams(window.location.search);
    const client = params.get("client");

    if (!client || !CLIENT_MAPPING[client]) {
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          font-family:Arial;
        ">
          <div style="
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 2px 10px rgba(0,0,0,.12);
            text-align:center;
          ">
            <h2>Invalid Link</h2>
            <p>This service request link is invalid or expired.</p>
          </div>
        </div>
      `;
    } else {
      const refCode = CLIENT_MAPPING[client];

      const redirectURL =
        `${APPS_SCRIPT_URL}?ref=${encodeURIComponent(refCode)}`;

      window.location.replace(redirectURL);
    }
  </script>

</body>
</html>
