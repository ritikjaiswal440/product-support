<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Service Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#111827;
    }

    .card{
      width:100%;
      max-width:430px;
      background:#ffffff;
      border-radius:20px;
      padding:42px 32px;
      text-align:center;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 4px 12px rgba(0,0,0,0.04);
      animation:fadeIn .4s ease;
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 24px;
      border-radius:18px;
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      font-weight:bold;
    }

    .spinner{
      width:56px;
      height:56px;
      border:5px solid #e5e7eb;
      border-top:5px solid #2563eb;
      border-radius:50%;
      margin:0 auto 24px;
      animation:spin 1s linear infinite;
    }

    .error-icon{
      width:72px;
      height:72px;
      border-radius:50%;
      background:#fee2e2;
      color:#dc2626;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      font-weight:bold;
      margin:0 auto 24px;
    }

    h1{
      font-size:24px;
      margin-bottom:12px;
      color:#111827;
    }

    p{
      color:#6b7280;
      font-size:15px;
      line-height:1.7;
    }

    .company{
      margin-top:18px;
      background:#eff6ff;
      color:#1d4ed8;
      padding:12px 16px;
      border-radius:12px;
      font-size:14px;
      font-weight:600;
    }

    .footer{
      margin-top:24px;
      color:#9ca3af;
      font-size:12px;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:480px){

      .card{
        padding:34px 24px;
      }

      h1{
        font-size:22px;
      }

    }

  </style>
</head>

<body>

  <div class="card" id="app">

    <div class="spinner"></div>

    <h1>Secure Service Portal</h1>

    <p>
      Redirecting to secure support system...
    </p>

    <div class="footer">
      Verifying enterprise access
    </div>

  </div>

  <script>

    (function(){

      /*
      ==================================================
      GOOGLE APPS SCRIPT URL
      ==================================================
      */

      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycby476ecukEizfce1mDME-1Y8h1y0oPqWAzbesy_fB5-0QmwXXJ_cHlEBsXvdGGXHdIEgw/exec";

      /*
      ==================================================
      APPROVED CLIENTS
      ==================================================
      */

      const CLIENTS = {

        "A7K2L1": "ABC Industries Pvt Ltd",
        "B8X9M2": "xyz",
        "C4P7R5": "demo",
        "D9T2K4": "client4",
        "E1W8L3": "client5"

      };

      /*
      ==================================================
      GET PARAM
      ==================================================
      */

      const params =
        new URLSearchParams(window.location.search);

      const client =
        params.get("client");

      /*
      ==================================================
      VALIDATION
      ==================================================
      */

      function isValid(value){

        return /^[A-Z0-9]{6,10}$/i.test(value);

      }

      /*
      ==================================================
      ERROR SCREEN
      ==================================================
      */

      function showError(){

        document.getElementById("app").innerHTML = `

          <div class="error-icon">!</div>

          <h1>Invalid Link</h1>

          <p>
            This service request link is invalid
            or expired.
          </p>

          <div class="footer">
            Please contact your administrator
          </div>

        `;
      }

      /*
      ==================================================
      INVALID PARAM
      ==================================================
      */

      if(!client || !isValid(client)){

        showError();
        return;

      }

      /*
      ==================================================
      CHECK CLIENT EXISTS
      ==================================================
      */

      const company =
        CLIENTS[client];

      if(!company){

        showError();
        return;

      }

      /*
      ==================================================
      SHOW COMPANY NAME
      ==================================================
      */

      document.getElementById("app").innerHTML = `

        <div class="spinner"></div>

        <h1>Secure Service Portal</h1>

        <p>
          Redirecting to secure support system...
        </p>

        <div class="company">
          ${company}
        </div>

        <div class="footer">
          Access verified successfully
        </div>

      `;

      /*
      ==================================================
      BUILD REDIRECT URL
      ==================================================
      */

      const redirectURL =
        `${APPS_SCRIPT_URL}?ref=${encodeURIComponent(client)}`;

      /*
      ==================================================
      REDIRECT
      ==================================================
      */

      setTimeout(() => {

        window.location.replace(redirectURL);

      }, 1500);

    })();

  </script>

</body>
</html>
