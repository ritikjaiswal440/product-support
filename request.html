<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Service Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:20px;
      padding:40px 30px;
      text-align:center;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 4px 12px rgba(0,0,0,0.04);
    }

    .spinner{
      width:56px;
      height:56px;
      border:5px solid #e5e7eb;
      border-top:5px solid #2563eb;
      border-radius:50%;
      margin:0 auto 24px;
      animation:spin 1s linear infinite;
    }

    .error-icon{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#fee2e2;
      color:#dc2626;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      font-weight:bold;
      margin:0 auto 24px;
    }

    h1{
      font-size:24px;
      margin-bottom:12px;
      color:#111827;
    }

    p{
      color:#6b7280;
      line-height:1.6;
      font-size:15px;
    }

    .company{
      margin-top:18px;
      background:#eff6ff;
      color:#1d4ed8;
      padding:12px;
      border-radius:12px;
      font-size:14px;
      font-weight:600;
    }

    .footer{
      margin-top:22px;
      font-size:12px;
      color:#9ca3af;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

  </style>
</head>

<body>

  <div class="card" id="app">

    <div class="spinner"></div>

    <h1>Secure Service Portal</h1>

    <p>
      Redirecting to secure support system...
    </p>

    <div class="footer">
      Verifying enterprise access
    </div>

  </div>

  <script>

    (function(){

      /*
      ============================================
      APPS SCRIPT URL
      ============================================
      */

      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycby476ecukEizfce1mDME-1Y8h1y0oPqWAzbesy_fB5-0QmwXXJ_cHlEBsXvdGGXHdIEgw/exec";

      /*
      ============================================
      VALID CLIENTS
      ============================================
      */

      const CLIENTS = {

        "A7K2L1": "ABC Industries Pvt Ltd",
        "B8X9M2": "xyz",
        "C4P7R5": "demo",
        "D9T2K4": "client4",
        "E1W8L3": "client5"

      };

      /*
      ============================================
      GET PARAM
      ============================================
      */

      const params =
        new URLSearchParams(window.location.search);

      let client =
        params.get("client");

      /*
      ============================================
      CLEAN INPUT
      ============================================
      */

      if(client){

        client =
          client.trim().toUpperCase();

      }

      /*
      ============================================
      VALIDATION
      ============================================
      */

      function showError(){

        document.getElementById("app").innerHTML = `

          <div class="error-icon">!</div>

          <h1>Invalid Link</h1>

          <p>
            This service request link is invalid
            or expired.
          </p>

          <div class="footer">
            Please contact your administrator
          </div>

        `;
      }

      /*
      ============================================
      INVALID PARAM
      ============================================
      */

      if(!client){

        showError();
        return;

      }

      /*
      ============================================
      CHECK CLIENT
      ============================================
      */

      const company =
        CLIENTS[client];

      if(!company){

        showError();
        return;

      }

      /*
      ============================================
      UPDATE UI
      ============================================
      */

      document.getElementById("app").innerHTML = `

        <div class="spinner"></div>

        <h1>Secure Service Portal</h1>

        <p>
          Redirecting to secure support system...
        </p>

        <div class="company">
          ${company}
        </div>

        <div class="footer">
          Access verified successfully
        </div>

      `;

      /*
      ============================================
      REDIRECT URL
      ============================================
      */

      const redirectURL =
        `${APPS_SCRIPT_URL}?ref=${encodeURIComponent(client)}`;

      /*
      ============================================
      REDIRECT
      ============================================
      */

      setTimeout(() => {

        window.location.replace(redirectURL);

      }, 1500);

    })();

  </script>

</body>
</html>
